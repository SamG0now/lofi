name: windows-installer
on:
  push:
  workflow_dispatch:
    inputs:
      client_id:
        description: Spotify Client ID to ship as the default (optional)
        required: false
jobs:
  build:
    # node-gyp can't detect VS 2026 on windows-latest
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # install runs node-gyp, which builds the N-API native modules with MSVC
      - run: pnpm install
      - name: Ship a default Spotify Client ID
        if: inputs.client_id
        env:
          CLIENT_ID: ${{ inputs.client_id }}
        shell: bash
        run: |
          [[ "$CLIENT_ID" =~ ^[0-9a-zA-Z]{32}$ ]] || { echo "Not a client ID"; exit 1; }
          sed -i "s/spotifyClientId: ''/spotifyClientId: '$CLIENT_ID'/" src/models/settings.ts
          grep -q "spotifyClientId: '$CLIENT_ID'" src/models/settings.ts
      - run: pnpm run production
      # bash: PowerShell splits the -c.key=value flags
      - run: pnpm exec electron-builder --win nsis --x64 --publish never -c.win.icon=icon.ico "-c.asarUnpack=**/*.node"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: lofi-windows-setup
          path: dist/*.exe
