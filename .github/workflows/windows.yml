name: windows-installer
on: [workflow_dispatch, push]
jobs:
  build:
    # node-gyp 10 can't detect VS 2026 on windows-latest
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: yarn install
      - run: yarn dist --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lofi-windows-setup
          path: dist/*.exe
